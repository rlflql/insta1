name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Flet
        run: |
          pip install --upgrade pip
          pip install flet instaloader
          
      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Build APK
        run: |
          flet build apk --project-name "InstaSavePro" --org "com.yourname.instasave"
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: instasave-apk
          path: build/apk/*.apk
